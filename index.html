<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UTM Wizard</title>

  <!-- CSS: how the page LOOKS -->
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      margin: 0;
      padding: 24px 16px;
    }
    .card {
      max-width: 560px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }
    h1 { margin: 0 0 4px; font-size: 28px; }
    .subtitle { margin: 0 0 24px; color: #6e6e73; }
    label { display: block; font-weight: 600; margin: 16px 0 6px; }
    .optional { font-weight: 400; color: #6e6e73; }
    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
    }
    input:focus { outline: none; border-color: #0071e3; }
    .result {
      margin-top: 24px;
      padding: 16px;
      background: #f5f5f7;
      border-radius: 10px;
      font-family: monospace;
      font-size: 14px;
      word-break: break-all;
    }
    button {
      margin-top: 12px;
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      background: #0071e3;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    button:disabled { background: #d2d2d7; cursor: not-allowed; }
  </style>
</head>

<body>
  <!-- HTML: what is ON the page -->
  <main class="card">
    <h1>UTM Wizard</h1>
    <p class="subtitle">Build clean, consistent UTM links in seconds.</p>

    <label for="url">Website URL</label>
    <input id="url" type="url" placeholder="https://example.com/page">

    <label for="source">Source</label>
    <input id="source" placeholder="facebook">

    <label for="medium">Medium</label>
    <input id="medium" placeholder="cpc">

    <label for="campaign">Campaign</label>
    <input id="campaign" placeholder="spring-sale">

    <label for="term">Term <span class="optional">(optional)</span></label>
    <input id="term" placeholder="running-shoes">

    <label for="content">Content <span class="optional">(optional)</span></label>
    <input id="content" placeholder="blue-banner">

    <div id="result" class="result">Your link will appear here.</div>
    <button id="copyBtn" disabled>Copy link</button>
  </main>

  <!-- JavaScript: what the page DOES -->
  <script>
    // 1. Grab the parts of the page we need
    const result = document.getElementById("result");
    const copyBtn = document.getElementById("copyBtn");
    const fieldIds = ["url", "source", "medium", "campaign", "term", "content"];

    // 2. Clean a value: remove extra spaces, make lowercase, spaces -> hyphens
    function clean(text) {
      return text.trim().toLowerCase().replace(/\s+/g, "-");
    }

    // 3. Read the form and build the link
    function buildLink() {
      let url = document.getElementById("url").value.trim();
      const source = clean(document.getElementById("source").value);
      const medium = clean(document.getElementById("medium").value);
      const campaign = clean(document.getElementById("campaign").value);
      const term = clean(document.getElementById("term").value);
      const content = clean(document.getElementById("content").value);

      // Required fields missing? Show a hint and stop here.
      if (!url || !source || !medium || !campaign) {
        result.textContent = "Fill in URL, source, medium and campaign.";
        copyBtn.disabled = true;
        return;
      }

      // Add https:// if the person forgot it
      if (!/^https?:\/\//i.test(url)) {
        url = "https://" + url;
      }

      // Check that the URL is valid
      let link;
      try {
        link = new URL(url);
      } catch (error) {
        result.textContent = "That URL doesn't look right. Check it for typos.";
        copyBtn.disabled = true;
        return;
      }

      // Add the UTM parameters
      link.searchParams.set("utm_source", source);
      link.searchParams.set("utm_medium", medium);
      link.searchParams.set("utm_campaign", campaign);
      if (term) link.searchParams.set("utm_term", term);
      if (content) link.searchParams.set("utm_content", content);

      result.textContent = link.toString();
      copyBtn.disabled = false;
    }

    // 4. Rebuild the link every time someone types in any field
    fieldIds.forEach(function (id) {
      document.getElementById(id).addEventListener("input", buildLink);
    });

    // 5. Copy the link when the button is clicked
    copyBtn.addEventListener("click", function () {
      navigator.clipboard.writeText(result.textContent).then(function () {
        copyBtn.textContent = "Copied!";
        setTimeout(function () { copyBtn.textContent = "Copy link"; }, 1500);
      });
    });
  </script>
</body>
</html>
